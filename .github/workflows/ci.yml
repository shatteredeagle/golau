name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, UI + security smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node node_modules/electron/install.js

      - run: npm run typecheck
      - run: npm test

      - name: Dependency audit (shipped code only)
        run: npm audit --omit=dev --audit-level=moderate

      - run: npm run build

      # Renders every screen offscreen against the mock ADO server and fails if the
      # hostile-work-item check finds anything not neutralised.
      - name: UI + security smoke
        timeout-minutes: 8
        run: |
          # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node mock/ado-mock.mjs &
          sleep 1
          GOLAU_DATA=.shots/data GOLAU_SHOTS=.shots timeout 300 xvfb-run -a npx electron . --disable-gpu 2>&1 | tee shots.log
          grep -q 'security-check' shots.log
          ! grep -q 'SECURITY CHECK FAILED' shots.log
          test "$(ls .shots/*.png | wc -l)" -ge 17

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: .shots/*.png
          retention-days: 14
          if-no-files-found: ignore

  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test

      # Same two-stage flow as release.yml (app folder, then installer from it), minus signing.
      - name: Build app
        run: npm run build && npx electron-builder --win dir --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Electron fuses
        shell: bash
        run: |
          npx @electron/fuses read --app dist/win-unpacked/Golau.exe | tee fuses.txt
          grep -q 'RunAsNode is Disabled' fuses.txt
          grep -q 'EnableNodeOptionsEnvironmentVariable is Disabled' fuses.txt
          grep -q 'EnableNodeCliInspectArguments is Disabled' fuses.txt
          grep -q 'OnlyLoadAppFromAsar is Enabled' fuses.txt

      - name: Build installer
        shell: bash
        run: |
          sha256sum dist/win-unpacked/Golau.exe | cut -d' ' -f1 > app-exe.sha256
          npx electron-builder --win nsis --x64 --prepackaged dist/win-unpacked --publish never
          echo "$(cat app-exe.sha256)  dist/win-unpacked/Golau.exe" | sha256sum -c -
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Test the installer (per-user, no admin, clean uninstall)
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup (Get-ChildItem dist/Golau-Setup-*.exe).FullName -ExpectedExeSha256 (Get-Content app-exe.sha256)

      - name: Upload test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golau-win-${{ github.sha }}
          path: dist/Golau-Setup-*.exe
          retention-days: 7
