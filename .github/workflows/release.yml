# Push a tag like v0.2.0 (matching package.json "version") to build on Windows and publish a
# GitHub Release with the zip + SHA256SUMS. Versions with a hyphen (v0.2.0-beta.1) are prereleases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v"
            exit 1
          fi

      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test

      - name: Package
        run: npm run build && npx electron-builder --win zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Electron fuses
        shell: bash
        run: |
          npx @electron/fuses read --app dist/win-unpacked/Tasklight.exe | tee fuses.txt
          grep -q 'RunAsNode is Disabled' fuses.txt
          grep -q 'EnableNodeOptionsEnvironmentVariable is Disabled' fuses.txt
          grep -q 'EnableNodeCliInspectArguments is Disabled' fuses.txt
          grep -q 'OnlyLoadAppFromAsar is Enabled' fuses.txt

      - name: Checksums
        shell: bash
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # the only job that can write to the repo, and it runs no project code
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          [[ "$TAG" == *-* ]] && pre="--prerelease"
          notes=$'**Install (Windows):** download `Tasklight-'"${TAG#v}"$'-win.zip`, unzip anywhere (e.g. `%LOCALAPPDATA%\\Tasklight`) and run `Tasklight.exe`. It is not code-signed, so SmartScreen asks: More info → Run anyway. Your settings and token carry over between versions.\n\nVerify the download: `Get-FileHash Tasklight-*.zip` should match `SHA256SUMS.txt`.\n'
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tasklight ${TAG#v}" \
            --notes "$notes" \
            --generate-notes $pre
