appId: com.golau.app
productName: Golau
# no auto-updater; releases are downloaded manually
publish: null
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: LICENSE
    to: LICENSE.txt
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
win:
  target: [nsis]
  icon: build/icon.ico
  # rcedit runs under wine when building from Linux
  signAndEditExecutable: true
# Per-user installer: installs to %LOCALAPPDATA%\Programs\Golau, registers the uninstaller
# under HKCU, and never asks for admin. Settings/token live in %APPDATA%\Golau and are kept
# across uninstall/upgrade.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  runAfterFinish: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Golau
  deleteAppDataOnUninstall: false
  differentialPackage: false
  artifactName: Golau-Setup-${version}.exe
  uninstallDisplayName: Golau
# Hardening switches baked into the exe: no running it as plain Node, no NODE_OPTIONS or
# --inspect injection, and only load the (integrity-checked) app.asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
linux:
  target: [dir]
  icon: build/icon.png
