appId: com.tasklight.app
productName: Tasklight
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target: [zip]
  icon: build/icon.ico
  # rcedit runs under wine when building from Linux
  signAndEditExecutable: true
linux:
  target: [dir]
  icon: build/icon.png
